[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-shop"
version = "0.1.0"
description = "Small demo repository for importscope"
readme = "README.txt"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Demo Maintainer", email = "demo@example.com" }]
dependencies = []

[project.scripts]
demo-shop = "demo_shop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
