tool:
  default_profile: overview
discovery:
  exclude:
  - .venv/**
  - venv/**
  - .tox/**
  - build/**
  - dist/**
  - .git/**
  - docs/**
  - tests/**
  - benchmarks/**
  - notebooks/**
  - tools/**
  - annnet/adapters/**
  - annnet/io/**
  - annnet/utils/**
policy:
  enabled: true
  module_group_depth: 3
  forbidden_imports:
  - source_prefixes:
    - annnet.core.graph
    target_prefixes:
    - annnet._support.dataframe_backend
  - source_prefixes:
    - annnet.core.graph
    target_prefixes:
    - annnet.algorithms.traversal
  allowed_private_target_prefixes:
  - annnet.core._
  - annnet._support
package: annnet
outputs:
  profiles:
    focused-symbol-labeled-module-dependency:
      description: Focused annnet slice with a readable labeled module graph.
      graphs:
      - id: symbol-labeled-module-dependency
        stem: module_dependency_with_symbols
        kind: module
        package_level: false
        labeled: true
        layout:
          direction: TB
          ranksep: 1.1
          nodesep: 0.18
          pad: 0.22
          ratio: fill
          splines: false
          concentrate: true
      formats:
      - svg
      summary: none
